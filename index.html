(function(){

var LOG = Array.isArray(SEED.log) ? SEED.log : [];
var PEOPLE = { usman:{name:"Usman"}, mahnoor:{name:"Mahnoor"}, both:{name:"Both"}, claude:{name:"Claude"} };
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var $ = function(id){ return document.getElementById(id); };
var pFilter = "all";

function pad(n){ return (n<10?"0":"")+n; }
function todayYMD(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ymdOffset(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ymdToDate(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function daysUntil(ymd){ return Math.round((ymdToDate(ymd) - ymdToDate(todayYMD()))/86400000); }
function fmtYMD(ymd){
  if(!ymd) return "";
  var d = ymdToDate(ymd), s = DAYS[d.getDay()].slice(0,3)+" "+d.getDate()+" "+MONTHS[d.getMonth()];
  if (d.getFullYear() !== new Date().getFullYear()) s += " "+d.getFullYear();
  return s;
}
function localYMDOfIso(iso){ var d=new Date(iso); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]; }); }
function personChip(p){ var n=(PEOPLE[p]||{name:p}).name; return '<span class="chip p-'+esc(p)+'">'+esc(n)+"</span>"; }
function matches(e){ return pFilter==="all" || e.person===pFilter || e.person==="both"; }

  if (e.status === "completed") return "done";
  if (e.deadline && daysUntil(e.deadline) < 0) return "passed";
  return e.status === "in_progress" ? "active" : "todo";

  var es = ENTRIES.filter(matches);

    if (pFilter!=="all") return "";

  var week=[], passed=[], active=[], done=[];
  es.forEach(function(e){
    var st=effState(e);
    if (st==="done") done.push(e);

      if (st==="passed") passed.push(e);
      if (st==="active") active.push(e);
      if (e.deadline){ var d=daysUntil(e.deadline); if(d>=0&&d<=7) week.push(e); }

  });

}

  var d = daysUntil(e.deadline), txt, cls="";
  if (e.status==="completed"){ txt = fmtYMD(e.deadline); }
  else if (d < 0){ cls="crit"; txt = "was "+fmtYMD(e.deadline)+" · "+(-d)+(d===-1?" day":" days")+" ago"; }
  else if (d === 0){ cls="warn"; txt = "due today"; }
  else if (d === 1){ cls="warn"; txt = "due tomorrow"; }
  else { if(d<=3) cls="warn"; txt = fmtYMD(e.deadline)+" · in "+d+" days"; }
  return '<span class="dl '+cls+'">'+esc(txt)+"</span>";
}
function cardHtml(e){
  var st = effState(e);
  var bar = (st==="active")
    ? '<span class="bar" aria-hidden="true"><i style="width:'+(+e.progress||0)+'%"></i></span><span class="pct">'+(+e.progress||0)+"%</span>" : "";
  var link = e.link ? ' <a href="'+esc(e.link)+'" target="_blank" rel="noopener">details ↗</a>' : "";
  var next = (e.nextAction && st!=="done")
    ? '<div class="next">→ '+esc(e.nextAction)+(e.nextActionDate?' <b>('+esc(fmtYMD(e.nextActionDate))+")</b>":"")+link+"</div>"
    : (link ? '<div class="next">'+link.trim()+"</div>" : "");
  var notes = e.notes ? '<div class="notes">'+esc(e.notes)+"</div>" : "";
  var meta = [e.org, e.category].filter(Boolean).map(esc).join(" · ");
  return '<div class="card sc-'+st+'">'+
    '<div class="t"><b>'+esc(e.title)+"</b>"+personChip(e.person)+"</div>"+
    (meta?'<div class="meta">'+meta+"</div>":"")+
    '<div class="row">'+pillFor(e)+dlBadge(e)+bar+"</div>"+next+notes+"</div>";
}
function renderGroups(){
  var es = ENTRIES.filter(matches);
  if (!es.length){
    $("groups").innerHTML = '<div class="empty"><b>Fresh slate.</b><br>Usman sends opportunity links to Claude — entries land here, prioritised by deadline.</div>';
    return;
  }
  var passed=[], week=[], later=[], nodate=[], done=[];
  es.forEach(function(e){
    var st = effState(e);
    if (st==="done") return done.push(e);
    if (st==="passed") return passed.push(e);
    if (!e.deadline) return nodate.push(e);
    (daysUntil(e.deadline)<=7 ? week : later).push(e);
  });
  var byDl = function(a,b){ return (a.deadline||"9999") < (b.deadline||"9999") ? -1 : 1; };
  passed.sort(byDl); week.sort(byDl); later.sort(byDl);
  nodate.sort(function(a,b){ return (a.nextActionDate||"9999") < (b.nextActionDate||"9999") ? -1 : 1; });
  done.sort(function(a,b){ return String(a.updatedAt)<String(b.updatedAt)?1:-1; });
  function grp(title, list){
    if (!list.length) return "";
    return '<div class="grp"><h2>'+title+' <span class="n">· '+list.length+"</span></h2>"+
      '<div class="cards">'+list.map(cardHtml).join("")+"</div></div>";
  }
  var html = grp("Deadline passed — decide or reschedule", passed)+
             grp("Due in the next 7 days", week)+
             grp("Coming up", later)+
             grp("No deadline set", nodate);
  if (done.length){
    html += '<details class="grp"><summary>Completed <span class="n">· '+done.length+"</span></summary>"+
      '<div class="cards" style="margin-top:8px">'+done.map(cardHtml).join("")+"</div></details>";
  }
  $("groups").innerHTML = html;
}

/* ---------- daily report ---------- */
var lastReportMd = "";
function reportData(){
  var t = todayYMD(), y = ymdOffset(-1);
  var open = ENTRIES.filter(function(e){ return effState(e)!=="done"; });
  function line(e, extra){ return { person:e.person, text:e.title+(extra?" — "+extra:"") }; }
  var passed = open.filter(function(e){ return effState(e)==="passed"; })
    .map(function(e){ return line(e, (-daysUntil(e.deadline))+(daysUntil(e.deadline)===-1?" day":" days")+" past deadline ("+fmtYMD(e.deadline)+")"); });
  var dueToday = open.filter(function(e){ return e.deadline && daysUntil(e.deadline)===0; })
    .map(function(e){ return line(e, e.nextAction||""); });
  var actions = open.filter(function(e){ return e.nextActionDate && e.nextActionDate<=t && !(e.deadline && daysUntil(e.deadline)<=0); })
    .map(function(e){ return line(e, e.nextAction||"next action due"); });
  var week = open.filter(function(e){ return e.deadline && daysUntil(e.deadline)>0 && daysUntil(e.deadline)<=7; })
    .sort(function(a,b){ return a.deadline<b.deadline?-1:1; })
    .map(function(e){ return line(e, fmtYMD(e.deadline)+" · in "+daysUntil(e.deadline)+" day"+(daysUntil(e.deadline)===1?"":"s")); });
  var ylog = LOG.filter(function(l){ return localYMDOfIso(l.ts)===y; });
  var tlog = LOG.filter(function(l){ return localYMDOfIso(l.ts)===t; });
  function snap(p){
    var mine = ENTRIES.filter(function(e){ return isFor(e,p); });
    var a=0,d=0,w=0;
    mine.forEach(function(e){ var st=effState(e);
      if(st==="done")d++; else { if(st==="active")a++; if(e.deadline&&daysUntil(e.deadline)>=0&&daysUntil(e.deadline)<=7)w++; } });
    return PEOPLE[p].name+": "+a+" in progress · "+w+" due this week · "+d+" completed";
  }
  return { today:t, passed:passed, dueToday:dueToday, actions:actions, week:week,
           ylog:ylog, tlog:tlog, snap:[snap("usman"), snap("mahnoor")] };
}
function renderReport(){
  var r = reportData();
  var d = ymdToDate(r.today);
  $("rep-date").textContent = DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  function ul(items, none){
    if (!items.length) return '<p class="none">'+none+"</p>";
    return "<ul>"+items.map(function(i){ return "<li>"+personChip(i.person)+" <span>"+esc(i.text)+"</span></li>"; }).join("")+"</ul>";
  }
  function logUl(items, none){
    if (!items.length) return '<p class="none">'+none+"</p>";
    return "<ul>"+items.map(function(l){ return "<li>"+personChip(l.who)+" <span>"+esc(l.text)+"</span></li>"; }).join("")+"</ul>";
  }
  $("rep-body").innerHTML =
    "<h3>Yesterday — what moved</h3>"+logUl(r.ylog,"No activity was logged yesterday.")+
    "<h3>Today so far</h3>"+logUl(r.tlog,"Nothing logged yet today.")+
    "<h3>Deadline passed — needs a decision</h3>"+ul(r.passed,"Nothing overdue. Keep it that way.")+
    "<h3>Due today</h3>"+ul(r.dueToday,"No deadlines land today.")+
    "<h3>Next actions due</h3>"+ul(r.actions,"No next actions scheduled for today.")+
    "<h3>Due in the next 7 days</h3>"+ul(r.week,"A quiet week ahead so far.")+
    '<div class="snap">'+r.snap.map(esc).join(" &nbsp;·&nbsp; ")+"</div>";
  lastReportMd = reportMd(r);
}
function reportMd(r){
  var d = ymdToDate(r.today);
  function sec(h, items, none){
    var out = "\n## "+h+"\n";
    if (!items.length) return out+"- "+none+"\n";
    return out+items.map(function(i){ return "- ["+(PEOPLE[i.person||i.who]||{name:i.person||i.who}).name+"] "+(i.text); }).join("\n")+"\n";
  }
  return "# Daily report — "+DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()+"\n"+
    sec("Yesterday — what moved", r.ylog, "No activity logged.")+
    sec("Deadline passed — needs a decision", r.passed, "Nothing overdue.")+
    sec("Due today", r.dueToday, "No deadlines today.")+
    sec("Next actions due", r.actions, "None scheduled.")+
    sec("Due in the next 7 days", r.week, "Nothing due this week yet.")+
    "\n## Snapshot\n- "+r.snap.join("\n- ")+"\n";
}
function copyText(txt, okMsg){
  function done(){ var b=$("rep-copy"); var t=b.textContent; b.textContent=okMsg; setTimeout(function(){ b.textContent=t; },1600); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}

/* ---------- events ---------- */
document.querySelectorAll(".tabs [data-tab]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x===b ? "true":"false"); });
    $("view-tasks").hidden = b.dataset.tab!=="tasks";
    $("view-report").hidden = b.dataset.tab!=="report";
    if (b.dataset.tab==="report") renderReport();
  });
});
$("pfilter").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-p]"); if(!b) return;
  pFilter = b.dataset.p;
  document.querySelectorAll("#pfilter [data-p]").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
  renderTiles(); renderGroups();
});
$("rep-copy").addEventListener("click", function(){ renderReport(); copyText(lastReportMd, "Copied ✓"); });
$("rep-dl").addEventListener("click", function(){
  renderReport();
  try {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lastReportMd], {type:"text/markdown"}));
    a.download = "gmi-report-"+todayYMD()+".md";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  } catch(e){ copyText(lastReportMd, "Copied ✓"); }
});

/* ---------- init ---------- */
$("updated").textContent = "Updated "+(SEED.generated||"—")+" · view-only, maintained by Claude";
$("foot").textContent = "Usman sends new opportunities and progress to Claude; the board and the 10:00 reminder emails update from there.";
renderTiles(); renderGroups();
})();
</script>
