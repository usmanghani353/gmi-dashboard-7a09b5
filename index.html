var ENTRIES = (Array.isArray(SEED.entries) ? SEED.entries : []).filter(function(e){ return e && e.id && !e.deleted; });
var JOBS = (Array.isArray(SEED.jobs) ? SEED.jobs : []).filter(function(j){ return j && j.id && !j.deleted; });
var PEOPLE = { usman:{name:"Usman"}, mahnoor:{name:"Mahnoor"}, both:{name:"Both"}, claude:{name:"Claude"} };
var STATUS_LABEL = { saved:"Saved", applied:"Applied", interview:"Interview", offer:"Offer", rejected:"Rejected", withdrawn:"Withdrawn", note:"Note" };
var TYPE_LABEL = { "part-time":"Part-time", "full-time":"Full-time", internship:"Internship", phd:"PhD", pupillage:"Pupillage", other:"Other" };
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var $ = function(id){ return document.getElementById(id); };
var pFilter = "all", lFilter = "all", lType = "all";

function pad(n){ return (n<10?"0":"")+n; }
function todayYMD(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ymdToDate(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function daysUntil(ymd){ return Math.round((ymdToDate(ymd) - ymdToDate(todayYMD()))/86400000); }
function fmtYMD(ymd){
  if(!ymd) return "";
  var d = ymdToDate(ymd), s = DAYS[d.getDay()].slice(0,3)+" "+d.getDate()+" "+MONTHS[d.getMonth()];
  if (d.getFullYear() !== new Date().getFullYear()) s += " "+d.getFullYear();
  return s;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]; }); }
function personChip(p){ var n=(PEOPLE[p]||{name:p}).name; return '<span class="chip p-'+esc(p)+'">'+esc(n)+"</span>"; }
function tile(v,l,extra,cls){ return '<div class="tile'+(cls?" "+cls:"")+'"><div class="v">'+v+'</div><div class="l">'+l+"</div>"+(extra||"")+"</div>"; }
function matches(e){ return pFilter==="all" || e.person===pFilter || e.person==="both"; }
function isFor(e,p){ return e.person===p || e.person==="both"; }
function effState(e){
  if (e.status === "completed") return "done";
  if (e.deadline && daysUntil(e.deadline) < 0) return "passed";
  return e.status === "in_progress" ? "active" : "todo";
}
function catClass(c){
  c = String(c||"").toLowerCase();
  if (c.indexOf("phd")>=0 || c.indexOf("doctora")>=0) return "cat-phd";
  if (c.indexOf("pupillage")>=0) return "cat-pupillage";
  if (c.indexOf("summer")>=0 || c.indexOf("school")>=0) return "cat-summer";
  if (c.indexOf("job")>=0 || c.indexOf("income")>=0 || c.indexOf("business")>=0) return "cat-job";
  return "cat-other";
}

/* ================= TASKS TAB ================= */
function renderTiles(){
  var es = ENTRIES.filter(matches);
  function split(list){
    if (pFilter!=="all") return "";
    var u=0,m=0,b=0;
    list.forEach(function(e){ if(e.person==="usman")u++; else if(e.person==="mahnoor")m++; else b++; });
    return '<div class="s">U '+u+" · M "+m+(b?" · Both "+b:"")+"</div>";
  }
  var week=[], passed=[], active=[], done=[];
  es.forEach(function(e){
    var st=effState(e);
    if (st==="done") done.push(e);
    else {
      if (st==="passed") passed.push(e);
      if (st==="active") active.push(e);
      if (e.deadline){ var d=daysUntil(e.deadline); if(d>=0&&d<=7) week.push(e); }
    }
  });
  $("tiles").innerHTML =
    tile(week.length,"Due in 7 days",split(week),"tl-warn")+
    tile(passed.length,"Deadline passed",split(passed),"tl-crit")+
    tile(active.length,"In progress",split(active),"tl-blue")+
    tile(done.length,"Completed",split(done),"tl-good");
}
function pillFor(e){
  var st = effState(e);
  if (st==="done")   return '<span class="pill st-done">✓ Completed</span>';
  if (st==="passed") return '<span class="pill st-passed">⚠ Deadline passed</span>';
  if (st==="active") return '<span class="pill st-active">● In progress</span>';
  return '<span class="pill st-todo">○ Not started</span>';
}
function dlBadge(e){
  if (!e.deadline) return "";
  var d = daysUntil(e.deadline), txt, cls="";
  if (e.status==="completed"){ txt = fmtYMD(e.deadline); }
  else if (d < 0){ cls="crit"; txt = "was "+fmtYMD(e.deadline)+" · "+(-d)+(d===-1?" day":" days")+" ago"; }
  else if (d === 0){ cls="warn"; txt = "due today"; }
  else if (d === 1){ cls="warn"; txt = "due tomorrow"; }
  else { if(d<=3) cls="warn"; txt = fmtYMD(e.deadline)+" · in "+d+" days"; }
  return '<span class="dl '+cls+'">'+esc(txt)+"</span>";
}
function cardHtml(e){
  var st = effState(e);
  var bar = (st==="active")
    ? '<span class="bar" aria-hidden="true"><i style="width:'+(+e.progress||0)+'%"></i></span><span class="pct">'+(+e.progress||0)+"%</span>" : "";
  var link = e.link ? ' <a href="'+esc(e.link)+'" target="_blank" rel="noopener">details ↗</a>' : "";
  var next = (e.nextAction && st!=="done")
    ? '<div class="next">→ '+esc(e.nextAction)+(e.nextActionDate?' <b>('+esc(fmtYMD(e.nextActionDate))+")</b>":"")+link+"</div>"
    : (link ? '<div class="next">'+link.trim()+"</div>" : "");
  var notes = e.notes ? '<div class="notes">'+esc(e.notes)+"</div>" : "";
  var meta = e.org ? '<div class="meta">'+esc(e.org)+"</div>" : "";
  var cat = e.category ? '<span class="cat '+catClass(e.category)+'">'+esc(e.category)+"</span>" : "";
  return '<div class="card sc-'+st+" pt-"+esc(e.person)+'">'+
    '<div class="t"><b>'+esc(e.title)+"</b>"+personChip(e.person)+"</div>"+
    meta+
    '<div class="row">'+pillFor(e)+cat+dlBadge(e)+bar+"</div>"+next+notes+"</div>";
}
function renderGroups(){
  var es = ENTRIES.filter(matches);
  if (!es.length){
    $("groups").innerHTML = '<div class="empty"><b>Fresh slate.</b><br>Usman sends opportunity links to Claude — entries land here, prioritised by deadline.</div>';
    return;
  }
  var passed=[], week=[], later=[], nodate=[], done=[];
  es.forEach(function(e){
    var st = effState(e);
    if (st==="done") return done.push(e);
    if (st==="passed") return passed.push(e);
    if (!e.deadline) return nodate.push(e);
    (daysUntil(e.deadline)<=7 ? week : later).push(e);
  });
  var byDl = function(a,b){ return (a.deadline||"9999") < (b.deadline||"9999") ? -1 : 1; };
  passed.sort(byDl); week.sort(byDl); later.sort(byDl);
  nodate.sort(function(a,b){ return (a.nextActionDate||"9999") < (b.nextActionDate||"9999") ? -1 : 1; });
  done.sort(function(a,b){ return String(a.updatedAt)<String(b.updatedAt)?1:-1; });
  function grp(title, list){
    if (!list.length) return "";
    return '<div class="grp"><h2>'+title+' <span class="n">· '+list.length+"</span></h2>"+
      '<div class="cards">'+list.map(cardHtml).join("")+"</div></div>";
  }
  var html = grp("Deadline passed — decide or reschedule", passed)+
             grp("Due in the next 7 days", week)+
             grp("Coming up", later)+
             grp("No deadline set", nodate);
  if (done.length){
    html += '<details class="grp"><summary>Completed <span class="n">· '+done.length+"</span></summary>"+
      '<div class="cards" style="margin-top:8px">'+done.map(cardHtml).join("")+"</div></details>";
  }
  $("groups").innerHTML = html;
}

/* ================= JOBS TAB ================= */
function matchesJob(j){ return (lFilter==="all" || j.person===lFilter) && (lType==="all" || j.type===lType); }
function renderJobTiles(){
  var js = JOBS.filter(matchesJob);
  function split(list){
    if (lFilter!=="all") return "";
    var u=0,m=0; list.forEach(function(j){ if(j.person==="usman")u++; else if(j.person==="mahnoor")m++; });
    return '<div class="s">U '+u+" · M "+m+"</div>";
  }
  var applied = js.filter(function(j){ return j.status && j.status!=="saved"; });
  var iv   = js.filter(function(j){ return j.status==="interview"; });
  var off  = js.filter(function(j){ return j.status==="offer"; });
  var rej  = js.filter(function(j){ return j.status==="rejected" || j.status==="withdrawn"; });
  $("ltiles").innerHTML =
    tile(applied.length,"Applications",split(applied),"tl-blue")+
    tile(iv.length,"Interviews",split(iv),"tl-warn")+
    tile(off.length,"Offers",split(off),"tl-good")+
    tile(rej.length,"Closed",split(rej),"tl-crit");
}
function jobTitle(j){
  if (j.role && j.org) return '<span class="ttl"><b>'+esc(j.role)+"</b> — "+esc(j.org)+"</span>";
  if (j.role) return '<span class="ttl"><b>'+esc(j.role)+"</b></span>";
  if (j.org)  return '<span class="ttl"><b>'+esc(j.org)+"</b></span>";
  return '<span class="ttl"><b>'+esc(j.notes||"Job application")+"</b></span>";
}
function jobItemHtml(j){
  var status = j.status || "applied";
  var stat = '<span class="pill st-'+esc(status)+'">'+esc(STATUS_LABEL[status]||status)+"</span>";
  var kind = j.type ? '<span class="kind">'+esc(TYPE_LABEL[j.type]||j.type)+"</span>" : "";
  var loc  = j.location ? '<span class="kind">'+esc(j.location)+"</span>" : "";
  var datechip = j.date ? '<span class="dl">'+(status==="saved"?"Saved ":"Applied ")+esc(fmtYMD(j.date))+"</span>" : "";
  var link = j.link ? '<a href="'+esc(j.link)+'" target="_blank" rel="noopener">link ↗</a>' : "";
  var hasHead = j.role || j.org;
  var body = "";
  if (hasHead && j.notes) body = '<div class="notes">'+esc(j.notes)+(link?" "+link:"")+"</div>";
  else if (link) body = '<div class="notes">'+link+"</div>";
  return '<div class="card ac-'+esc(status)+" pt-"+esc(j.person)+'">'+
    '<div class="t">'+jobTitle(j)+personChip(j.person)+"</div>"+
    '<div class="row">'+stat+kind+loc+datechip+"</div>"+body+"</div>";
}
function renderJobs(){
  var js = JOBS.filter(matchesJob);
  if (!js.length){
    $("logbody").innerHTML = '<div class="empty"><b>No job applications logged yet.</b><br>'+
      'Track every part-time and full-time job you and Mahnoor apply for here, by stage.<br>'+
      'Tell Claude where you applied — e.g. '+
      '<code>Mahnoor applied to Boots, Lewisham — retail, part-time</code> — and it appears here, then moves to Interview / Offer as you update it.</div>';
    return;
  }
  var by = { offer:[], interview:[], applied:[], saved:[], rejected:[], withdrawn:[] };
  js.forEach(function(j){ (by[j.status] || by.applied).push(j); });
  var byDate = function(a,b){ return (a.date||"") < (b.date||"") ? 1 : -1; };
  Object.keys(by).forEach(function(k){ by[k].sort(byDate); });
  function grp(title, list){
    if (!list.length) return "";
    return '<div class="grp"><h2>'+title+' <span class="n">· '+list.length+"</span></h2>"+
      '<div class="cards">'+list.map(jobItemHtml).join("")+"</div></div>";
  }
  var html = grp("Offers", by.offer)+
             grp("Interviews", by.interview)+
             grp("Applied — awaiting", by.applied)+
             grp("Saved — to apply", by.saved);
  var closed = by.rejected.concat(by.withdrawn).sort(byDate);
  if (closed.length){
    html += '<details class="grp"><summary>Closed <span class="n">· '+closed.length+"</span></summary>"+
      '<div class="cards" style="margin-top:8px">'+closed.map(jobItemHtml).join("")+"</div></details>";
  }
  $("logbody").innerHTML = html;
}

/* ================= EVENTS ================= */
document.querySelectorAll(".tabs [data-tab]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x===b ? "true":"false"); });
    $("view-tasks").hidden = b.dataset.tab!=="tasks";
    $("view-log").hidden = b.dataset.tab!=="log";
    if (b.dataset.tab==="log"){ renderJobTiles(); renderJobs(); }
  });
});
$("pfilter").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-p]"); if(!b) return;
  pFilter = b.dataset.p;
  document.querySelectorAll("#pfilter [data-p]").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
  renderTiles(); renderGroups();
});
$("lfilter").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-p]"); if(!b) return;
  lFilter = b.dataset.p;
  document.querySelectorAll("#lfilter [data-p]").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
  renderJobTiles(); renderJobs();
});
$("ltype").addEventListener("change", function(){ lType = this.value; renderJobTiles(); renderJobs(); });

/* ================= INIT ================= */
$("updated").textContent = "Updated "+(SEED.generated||"—")+" · view-only, maintained by Claude";
$("foot").textContent = "Usman keeps this current via Claude — opportunities & deadlines in Tasks, job applications in the Jobs tab.";
renderTiles(); renderGroups();
})();
</script>

</body>
